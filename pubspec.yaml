name: tstokenlib
description: An implementation of the TSL1 Token Protocol for the BSV blockchain.
version: 2.1.0
repository: https://github.com/twostack/tstokenlib

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.3
  dartsv: ^3.1.0

  crypto: ^3.0.6
  convert: ^3.1.2
  # used directly by signer_adapter.dart; it arrived transitively through
  # dartsv until 2.0.0, which pub publish refuses
  hex: ^0.2.0
  collection: ^1.18.0
  buffer: ^1.2.3
  cryptography: ^2.5.0
  hooks: ^2.2.0
  code_assets: ^2.1.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.21.0
