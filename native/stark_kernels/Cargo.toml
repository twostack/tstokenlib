[package]
name = "stark_kernels"
version = "0.1.0"
edition = "2021"
description = "Native kernels for the tstokenlib Circle-STARK prover (M31 circle FFT, SHA256 Merkle, DEEP quotients, FRI folds)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
