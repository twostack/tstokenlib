[package]
name = "stark_kernels"
version = "0.1.0"
edition = "2021"
description = "Native kernels for the tstokenlib Circle-STARK prover (M31 circle FFT, SHA256 Merkle, DEEP quotients, FRI folds)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
default = []
# Experimental GPU backend (Apple Silicon only; see README). Off by default:
# without it the crate has no Metal symbol and builds unchanged everywhere.
metal = ["dep:metal"]

[dependencies]
ml-kem = { version = "0.2.1", features = ["deterministic"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }
